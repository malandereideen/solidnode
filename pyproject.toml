[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solidnode"
version = "0.1.0"
description = "Visual, node-based modelling for SolidCraft — a Grasshopper-style editor with live preview, data trees and fabrication nodes for laser cutting and 3D printing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mario Wichmann" }]
requires-python = ">=3.10"
keywords = ["cad", "nurbs", "node-editor", "parametric", "solidcraft", "grasshopper", "laser-cutting", "3d-printing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    # geometry kernel, file formats and the 3D viewport (pinned: 0.12.2)
    "serpentine3d @ git+https://github.com/chisomobanzi/Serpentine3D@eb02726eba44e55a958a1946fbc1823a51219efb",
    "NodeGraphQt>=0.6.44",
    "setuptools",          # NodeGraphQt still imports distutils
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
solidnode = "solidnode.cli:main"

[project.urls]
Homepage = "https://github.com/malandereideen/solidnode"
Issues = "https://github.com/malandereideen/solidnode/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solidnode = ["examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
